LvJxRoBRQTXEZ2Kzs-51\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-52\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontFamily=DM Mono;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DDM%2BMono;fontSize=24;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;color: rgb(255, 255, 255);&amp;quot;&amp;gt;Python&amp;lt;/span&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;30\&quot; width=\&quot;124\&quot; x=\&quot;336\&quot; y=\&quot;223\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-59\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-53\&quot; style=\&quot;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;strokeColor=light-dark(#D9A441,#D9A441);endArrow=none;endFill=0;sketch=1;curveFitting=1;jiggle=2;\&quot; target=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-51\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-53\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontFamily=DM Mono;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DDM%2BMono;fontSize=24;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;color: rgb(255, 255, 255);&amp;quot;&amp;gt;Javascript&amp;lt;/span&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;30\&quot; width=\&quot;124\&quot; x=\&quot;128\&quot; y=\&quot;359\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-58\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;Nn-LvJxRoBRQTXEZ2Kzs-54\&quot; style=\&quot;rounded=0;o <script type="text/javascript">
/* ===== Animation au survol : textes cachés par défaut, révélés de l'intérieur vers l'extérieur ===== */
(function () {
  // --- Réglages ---
  var CENTER   = 'Nn-LvJxRoBRQTXEZ2Kzs-6'; // ellipse centrale (jamais animée)
  var DUR_IN   = 900;   // ms, apparition des textes
  var DUR_OUT  = 450;   // ms, disparition
  var STAGGER  = 90;    // ms de décalage entre textes d'un même cercle
  var HIDE_DELAY = 450; // ms de tolérance avant de refermer (le temps d'aller vers les textes)
  var AMP      = 3;     // amplitude (px) du mouvement du cercle
  var START_SCALE = 0.35, START_TRAVEL = 0.75; // départ : petit et proche du cercle
  var EASE_IN = 'cubic-bezier(.16,1,.3,1)', EASE_OUT = 'cubic-bezier(.4,0,.2,1)';

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    AMP = 0; DUR_IN = 250; DUR_OUT = 200; STAGGER = 0;
  }
  var NS = 'http://www.w3.org/2000/svg';
  var div = document.querySelector('.mxgraph-anim');
  if (!div || !window.GraphViewer) return;
  div.style.visibility = 'hidden'; // évite le flash avant le masquage initial

  GraphViewer.createViewerForElement(div, function (viewer) {
    var graph = viewer.graph, model = graph.model, view = graph.view;
    var map = {}, groups;

    function isText(c)   { return model.isVertex(c) && /^text;/.test(c.style || ''); }
    function isCircle(c) { return model.isVertex(c) && /^ellipse;/.test(c.style || '') && c.id !== CENTER; }

    // Détection automatique : cercle <-> texte reliés par un connecteur
    for (var id in model.cells) {
      var e = model.cells[id];
      if (!model.isEdge(e)) continue;
      var s = model.getTerminal(e, true), t = model.getTerminal(e, false);
      if (!s || !t) continue;
      var c = (isCircle(s) && isText(t)) ? s : (isCircle(t) && isText(s)) ? t : null;
      if (!c) continue;
      var tx = (c === s) ? t : s;
      var g = map[c.id] || (map[c.id] = { circle: c, texts: [], edges: [], shown: false,
                                           amp: 0, target: 0, timer: null, scale: null });
      if (g.texts.indexOf(tx) < 0) g.texts.push(tx);
      g.edges.push(e);
    }
    groups = Object.keys(map).map(function (k, i) { map[k].ph = i * 1.7; return map[k]; });

    function nodes(cell) {
      var st = view.getState(cell), a = [];
      if (st && st.shape && st.shape.node) a.push(st.shape.node);
      if (st && st.text && st.text.node) a.push(st.text.node);
      return a;
    }
    function hitOf(cell, kind) { // zone de survol transparente, insérée dans le shape
      var st = view.getState(cell); if (!st || !st.shape || !st.shape.node) return null;
      var n = st.shape.node, h = n.querySelector('[data-hit]');
      if (!h) {
        h = document.createElementNS(NS, kind === 'circle' ? 'ellipse' : 'rect');
        if (kind === 'circle') {
          h.setAttribute('cx', st.x + st.width / 2); h.setAttribute('cy', st.y + st.height / 2);
          h.setAttribute('rx', st.width / 2);        h.setAttribute('ry', st.height / 2);
        } else {
          h.setAttribute('x', st.x); h.setAttribute('y', st.y);
          h.setAttribute('width', st.width); h.setAttribute('height', st.height);
        }
        h.setAttribute('fill', 'transparent'); h.setAttribute('stroke', 'none');
        h.setAttribute('data-hit', '1'); h.style.pointerEvents = 'all';
        n.appendChild(h);
      }
      return h;
    }
    function listen(el, g) {
      if (!el || el.__g) return;
      el.__g = g;
      el.addEventListener('mouseenter', function () { enter(g); });
      el.addEventListener('mouseleave', function () { leave(g); });
      el.addEventListener('pointerdown', function (ev) { // tactile : tap = bascule
        if (ev.pointerType === 'touch') { g.shown ? (clearTimeout(g.timer), close(g)) : enter(g); }
      });
    }

    // --- Pose "cachée" : proche du centre du cercle, petit, invisible ---
    function hiddenPose(g, tcell) {
      var cs = view.getState(g.circle), ts = view.getState(tcell);
      var dx = (cs.x + cs.width / 2 - ts.x - ts.width / 2) * START_TRAVEL;
      var dy = (cs.y + cs.height / 2 - ts.y - ts.height / 2) * START_TRAVEL;
      return 'translate(' + dx + 'px,' + dy + 'px) scale(' + START_SCALE + ')';
    }

    function setState(g, on, instant) {
      g.shown = on;
      g.texts.forEach(function (tc, i) {
        if (!view.getState(tc)) return;
        var pose = hiddenPose(g, tc), d = instant ? 0 : (on ? DUR_IN : DUR_OUT),
            delay = (instant || !on) ? 0 : i * STAGGER;
        nodes(tc).forEach(function (n) {
          n.style.transformBox = 'fill-box'; n.style.transformOrigin = 'center';
          n.style.transition = instant ? 'none' :
            'transform ' + d + 'ms ' + (on ? EASE_IN : EASE_OUT) + ' ' + delay + 'ms, ' +
            'opacity ' + Math.round(d * (on ? 0.7 : 1)) + 'ms ease ' + delay + 'ms';
          n.style.transform = on ? 'translate(0px,0px) scale(1)' : pose;
          n.style.opacity = on ? '' : '0';
          n.style.pointerEvents = on ? '' : 'none';
        });
        var h = hitOf(tc, 'rect'); if (h) { h.style.pointerEvents = on ? 'all' : 'none'; }
      });
      g.edges.forEach(function (ec, i) {
        var delay = (instant || !on) ? 0 : 120 + i * STAGGER / 2;
        nodes(ec).forEach(function (n) {
          n.style.transition = instant ? 'none' :
            'opacity ' + (on ? DUR_IN * 0.8 : DUR_OUT) + 'ms ease ' + delay + 'ms';
          n.style.opacity = on ? '' : '0';
          n.style.pointerEvents = 'none';
        });
      });
    }
    function close(g) { setState(g, false); g.target = 0; }
    function enter(g) {
      clearTimeout(g.timer);
      if (!g.shown) setState(g, true);
      g.target = 1; kick();
    }
    function leave(g) {
      clearTimeout(g.timer);
      g.timer = setTimeout(function () { close(g); }, HIDE_DELAY);
    }

    // --- Mouvement subtil du cercle autour de sa position ---
    var raf = null, last = 0;
    function frame(ts) {
      var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
      var busy = false, t = ts / 1000;
      groups.forEach(function (g) {
        g.amp += (g.target - g.amp) * (1 - Math.exp(-dt * 4));
        if (Math.abs(g.target - g.amp) < 0.003) g.amp = g.target;
        var ns = nodes(g.circle);
        if (g.amp === 0 && g.target === 0) {
          ns.forEach(function (n) { n.style.transform = ''; });
          return;
        }
        busy = true;
        var a = g.amp * AMP * view.scale;
        var x = a * (Math.sin(t * 1.1 + g.ph) + 0.5 * Math.sin(t * 2.3 + g.ph * 2)) / 1.5;
        var y = a * (Math.cos(t * 0.9 + g.ph) + 0.5 * Math.cos(t * 1.9 + g.ph * 3)) / 1.5;
        ns.forEach(function (n) { n.style.transition = 'none'; n.style.transform = 'translate(' + x + 'px,' + y + 'px)'; });
      });
      raf = busy ? requestAnimationFrame(frame) : null;
    }
    function kick() { if (!raf && AMP > 0) raf = requestAnimationFrame(frame); }

    // --- (Ré)initialisation idempotente : survit aux re-rendus du viewer ---
    function applyAll() {
      groups.forEach(function (g) {
        var cs = view.getState(g.circle); if (!cs || !cs.shape || !cs.shape.node) return;
        var fresh = (g.scale !== view.scale);
        g.scale = view.scale;
        var all = nodes(g.circle);
        g.texts.concat(g.edges).forEach(function (c) { all = all.concat(nodes(c)); });
        all.forEach(function (n) { if (!n.__anim) { n.__anim = 1; fresh = true; } });
        listen(hitOf(g.circle, 'circle'), g);
        nodes(g.circle).forEach(function (n) { listen(n, g); });
        g.texts.forEach(function (tc) { listen(hitOf(tc, 'rect'), g); nodes(tc).forEach(function (n) { listen(n, g); }); });
        if (fresh) setState(g, g.shown, true);
      });
    }

    var tries = 0, iv = setInterval(function () {
      var ready = groups.length > 0 && groups.every(function (g) {
        var s = view.getState(g.circle); return s && s.shape && s.shape.node &&
          g.texts.every(function (tc) { return view.getState(tc); });
      });
      if (ready || ++tries > 100) {
        clearInterval(iv); applyAll(); div.style.visibility = 'visible';
        var pend = false;
        new MutationObserver(function () {
          if (pend) return; pend = true;
          requestAnimationFrame(function () { pend = false; applyAll(); });
        }).observe(graph.container, { childList: true, subtree: true });
      }
    }, 100);
  });
})();
